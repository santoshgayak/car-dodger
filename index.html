<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car-Dodger</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="gameContainer">
      <div class="startScreen" id="startScreen">
        <h1 class="gameTitle">Car Dodger</h1>
        <h4 id="instruction">Instruction</h4>
        <ul class="instructionContainer">
          <li>➡️ for right</li>
          <li>⬅️ for left</li>
          <li>⬆️ for straight</li>
          <li>S for boost</li>
          <li>Avoid other cars and obstacles.</li>
          <li>Collect coins to increase your score.</li>
          <li>Stay on the road.</li>
          <li>Survive as long as possible!</li>
        </ul>
        <button id="startButton">Start 🏁</button>
      </div>
      <div class="gameScreen" id="gameScreen">
        <div class="track" id="track">
          <div class="boundryLine"></div>
          <div class="boundryLine rightBorderLine"></div>
        </div>
      </div>
      <div class="endScreen" id="endScreen"></div>
    </div>

    <script src="./classes//audio.js"></script>
    <script src="./classes/player.js"></script>
    <script src="./classes/obstacle.js"></script>
    <script src="./classes/divider.js"></script>
    <script src="./classes/game.js"></script>
    <script src="index.js"></script>
  </body>
</html>
