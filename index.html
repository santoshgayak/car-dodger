<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car-Dodger</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="gameContainer health">
      <div class="scoresContainer" id="scoresContainer">
        <div class="score">
          <div class="imageContainer">
            <img
              src="/assets/images/Glossy Golden Star Trophy.png"
              alt="Trophy"
              height="90px"
              id="trophy"
            />
          </div>
          <div class="info">
            <h4 class="infoTitle" id="scoreTitle">Score</h4>
            <h3 class="infoNumber" id="score">12,300</h3>
          </div>
        </div>
        <div class="coins">
          <div class="imageContainer">
            <img src="/assets/images/Shiny Gold Star Coin.png" alt="coin" />
          </div>
          <div class="info">
            <h4 class="infoTitle" id="coinTitle">Coins</h4>
            <h3 class="infoNumber" id="coinsScore">1300</h3>
          </div>
        </div>
        <div class="distance">
          <div class="imageContainer">
            <img
              src="/assets/images/Glossy Red Location Pin.png"
              alt="location"
            />
          </div>
          <div class="info">
            <h4 class="infoTitle" id="distanceTitle">Distance</h4>
            <h3 class="infoNumber" id="distanceScore">120 <span>km</span></h3>
          </div>
        </div>
        <div class="highestScore">
          <div class="imageContainer">
            <img
              src="/assets/images/Glossy Jewel-Encrusted Golden Crown.png"
              alt="crown"
            />
          </div>
          <div class="info">
            <h4 class="infoTitle" id="highestScoreTitle">Score</h4>
            <h3 class="infoNumber" id="highestScore">12,300</h3>
          </div>
        </div>
      </div>

      <div class="startScreen" id="startScreen">
        <h1 class="gameTitle">
          Car <br />
          <span>Dodger</span>
        </h1>
        <!--
       
        <ul class="instructionContainer">
          <li>➡️ for right</li>
          <li>⬅️ for left</li>
          <li>⬆️ for straight</li>
          <li>S for boost</li>
          <li>Avoid other cars and obstacles.</li>
          <li>Collect coins to increase your score.</li>
          <li>Stay on the road.</li>
          <li>Survive as long as possible!</li>
        </ul>
         -->
        <button id="startButton">🏁 Start Game</button>
      </div>
      <div class="gameScreen" id="gameScreen">
        <div class="track" id="track">
          <div class="boundryLine"></div>
          <div class="boundryLine rightBorderLine"></div>
        </div>
      </div>
      <div class="endScreen" id="endScreen">
        <div class="gameOverTitle">
          <img src="./assets/images/Glossy Golden Star Trophy.png" alt="" />
          <h1 class="gameTitle">Game <span>Over</span></h1>
        </div>
        <div class="message">
          <h3>Better Luck Next Time!</h3>
        </div>
        <div class="endScoresContainer" id="endScoresContainer">
          <div class="score">
            <div class="imageContainer">
              <img
                src="/assets/images/Glossy Golden Star Trophy.png"
                alt="Trophy"
                height="90px"
                id="trophy"
              />
            </div>
            <div class="info">
              <h4 class="infoTitle" id="scoreTitle">Score</h4>
              <h3 class="infoNumber" id="endScore">12,300</h3>
            </div>
          </div>
          <div class="coins">
            <div class="imageContainer">
              <img src="/assets/images/Shiny Gold Star Coin.png" alt="coin" />
            </div>
            <div class="info">
              <h4 class="infoTitle" id="coinTitle">Coins</h4>
              <h3 class="infoNumber" id="endCoinsScore">1300</h3>
            </div>
          </div>
          <div class="distance">
            <div class="imageContainer">
              <img
                src="/assets/images/Glossy Red Location Pin.png"
                alt="location"
              />
            </div>
            <div class="info">
              <h4 class="infoTitle" id="distanceTitle">Distance</h4>
              <h3 class="infoNumber" id="endDistanceScore">
                120 <span>km</span>
              </h3>
            </div>
          </div>
          <div class="highestScore">
            <div class="imageContainer">
              <img
                src="/assets/images/Glossy Jewel-Encrusted Golden Crown.png"
                alt="crown"
              />
            </div>
            <div class="info">
              <h4 class="infoTitle" id="highestScoreTitle">Highest</h4>
              <h3 class="infoNumber" id="endHighestScore">12,300</h3>
            </div>
          </div>
        </div>

        <button id="replayButton">🏁 Replay Game</button>
      </div>

      <div class="scoresContainer">
        <div class="score">
          <div class="imageContainer">
            <img
              src="/assets/images/Glossy Chrome Semicircular Speedometer Gauge.png"
              alt="Trophy"
              height="90px"
              id="trophy"
            />
          </div>
          <div class="info">
            <h4 class="infoTitle" id="speedTitle">Speed</h4>
            <h3 class="infoNumber" id="speed">120 <span>km/h</span></h3>
          </div>
        </div>
        <div class="lives">
          <div class="info">
            <h4 class="infoTitle" id="livesTitle">Lives</h4>
          </div>
          <div class="imageContainer">
            <img
              class="heart"
              src="/assets/images/Glossy 3D Red Heart Icon.png"
              id="heart1"
              alt="coin"
            />
            <img
              class="heart"
              src="/assets/images/Glossy 3D Red Heart Icon.png"
              id="heart2"
              alt="coin"
            />
            <img
              class="heart"
              src="/assets/images/Glossy 3D Red Heart Icon.png"
              id="heart3"
              alt="coin"
            />
          </div>
        </div>

        <div class="carCondition">
          <div class="imageContainer">
            <img
              src="/assets/images/Glossy V8 Engine Cartoon Icon.png"
              alt="crown"
            />
          </div>
          <div class="info">
            <h4 class="infoTitle" id="highestScoreTitle">Engine</h4>
            <h3 class="infoNumber" id="engineCondition">100 %</h3>
          </div>
        </div>
      </div>
    </div>

    <script src="./classes//audio.js"></script>
    <script src="./classes/player.js"></script>
    <script src="./classes/obstacle.js"></script>
    <script src="./classes/divider.js"></script>
    <script src="./classes/game.js"></script>
    <script src="index.js"></script>
  </body>
</html>
